<!DOCTYPE html>
<html>
<head>
<style>
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #ffffff, #ffe6f2, #dbeeff);
        padding: 20px;
    }

    .notification-container {
        max-width: 800px;
        margin: auto;
        background: linear-gradient(135deg, #ffffff, #ffd6ec, #d6e8ff);
        border-radius: 18px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        border: 2px solid rgba(255,255,255,0.5);
        padding: 22px 28px;
        animation: slideDown 0.8s ease forwards;
        opacity: 0;
        position: relative;
        overflow: hidden;
    }

    .notification-container::before {
        content: "";
        position: absolute;
        top: -50px;
        right: -50px;
        width: 140px;
        height: 140px;
        background: rgba(255,255,255,0.35);
        border-radius: 50%;
    }

    @keyframes slideDown {
        from {
            opacity: 0;
            transform: translateY(-20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .notification-title {
        font-size: 18px;
        font-weight: bold;
        color: #4a4aff;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .notification-message {
        font-size: 15px;
        color: #333;
        line-height: 1.7;
    }

    .notification-message b {
        color: #ff4fa3;
    }

    .notification-time {
        margin-top: 12px;
        font-size: 12px;
        color: #666;
        text-align: right;
    }

    .notification-container:hover {
        transform: scale(1.01);
        transition: 0.3s ease;
        box-shadow: 0 10px 30px rgba(255, 105, 180, 0.15);
    }
</style>
</head>

<body>

<div class="notification-container">

    <div class="notification-title">
        🛡️ Child Protection Alert
    </div>

    <div class="notification-message">
        Ensure your child stays <b>safe online</b> by monitoring screen time, 
        blocking harmful content, and encouraging healthy digital habits. 
        Child protection tools help create a secure and positive internet experience.
    </div>

    <div class="notification-time">
        Updated: Today
    </div>

</div>

</body>
</html>
